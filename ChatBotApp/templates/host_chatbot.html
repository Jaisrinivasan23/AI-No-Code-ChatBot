<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #e5e7eb;
            --user-msg-color: #4f46e5;
            --bot-msg-color: #6b7280;
            --light-bg: #f9fafb;
            --dark-bg: #1f2937;
            --light-text: #f9fafb;
            --dark-text: #1f2937;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--light-bg);
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        
        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--light-text);
        }
        
        .chat-container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: white;
            box-shadow: var(--shadow);
        }
        
        .dark-mode .chat-container {
            background-color: #111827;
            border: 1px solid #374151;
        }
        
        .chat-header {
            padding: 8px 14px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .chat-title {
            font-weight: 600;
            margin: 0;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .chat-options {
            display: flex;
            align-items: center;
        }
        
        .btn-icon {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 3px;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        
        .btn-icon:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
        }
        
        .chat-box::-webkit-scrollbar {
            width: 3px;
        }
        
        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-box::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 20px;
        }
        
        .dark-mode .chat-box::-webkit-scrollbar-thumb {
            background-color: #4b5563;
        }
        
        .message {
            max-width: 85%;
            padding: 8px 10px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            font-size: 0.85rem;
        }
        
        .message-content {
            word-wrap: break-word;
        }
        
        .message-meta {
            font-size: 0.62rem;
            opacity: 0.7;
            margin-top: 2px;
            text-align: right;
        }
        
        .user-message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            align-self: flex-end;
        }
        
        .bot-message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            align-self: flex-start;
        }
        
        .user-message {
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 3px;
        }
        
        .bot-message {
            background-color: var(--secondary-color);
            color: var(--dark-text);
            border-bottom-left-radius: 3px;
        }
        
        .dark-mode .bot-message {
            background-color: #374151;
            color: var(--light-text);
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 6px 10px;
            background-color: var(--secondary-color);
            border-radius: 12px;
            border-bottom-left-radius: 3px;
            max-width: fit-content;
            opacity: 0;
            transition: opacity 0.3s;
            align-self: flex-start;
        }
        
        .dark-mode .typing-indicator {
            background-color: #374151;
        }
        
        .typing-indicator.active {
            opacity: 1;
        }
        
        .typing-dot {
            width: 5px;
            height: 5px;
            background-color: var(--bot-msg-color);
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out;
            opacity: 0.6;
        }
        
        .dark-mode .typing-dot {
            background-color: var(--light-text);
        }
        
        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing-bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-3px);
            }
        }
        
        .input-container {
            padding: 8px 12px;
            border-top: 1px solid #e5e7eb;
            background-color: white;
            position: relative;
            flex-shrink: 0;
        }
        
        .dark-mode .input-container {
            background-color: #111827;
            border-top: 1px solid #374151;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--light-bg);
            border-radius: 18px;
            padding: 5px 10px;
            transition: box-shadow 0.3s;
        }
        
        .dark-mode .input-group {
            background-color: #1f2937;
        }
        
        .input-group:focus-within {
            box-shadow: 0 0 0 2px var(--primary-color);
        }
        
        #user-message {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 5px 0;
            outline: none;
            color: var(--dark-text);
            font-size: 0.85rem;
        }
        
        .dark-mode #user-message {
            color: var(--light-text);
        }
        
        .btn-send {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 0.7rem;
        }
        
        .btn-send:hover {
            transform: scale(1.05);
            background-color: #4338ca;
        }
        
        @media (max-width: 550px) {
            .chat-container {
                max-width: 100%;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2 class="chat-title">{{ chatbot.name }}</h2>
            <div class="chat-options">
                <button id="dark-mode-toggle" class="btn-icon" title="Toggle Light/Dark">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div id="chat-box" class="chat-box">
            <!-- Chat messages will be appended here -->
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <div class="input-container">
            <div class="input-group">
                <input type="text" id="user-message" class="form-control" placeholder="Ask me anything..." autocomplete="off" required>
                <button onclick="sendMessage()" class="btn-send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Dark mode toggle
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const body = document.body;
        const darkIcon = '<i class="fas fa-moon"></i>';
        const lightIcon = '<i class="fas fa-sun"></i>';

        // Check for saved theme preference
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            darkModeToggle.innerHTML = lightIcon;
        }

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                darkModeToggle.innerHTML = lightIcon;
                localStorage.setItem('darkMode', 'enabled');
            } else {
                darkModeToggle.innerHTML = darkIcon;
                localStorage.setItem('darkMode', 'disabled');
            }
        });

        // Add welcome message on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const chatBox = document.getElementById('chat-box');
                const currentTime = getCurrentTime();
                
                chatBox.innerHTML = `
                    <div class="bot-message-wrapper">
                        <div class="message bot-message">
                            <div class="message-content">Hello! I'm {{ chatbot.name }}. How can I help you today?</div>
                            <div class="message-meta">${currentTime}</div>
                        </div>
                    </div>
                `;
            }, 500);
        });

        // Listen for Enter key on input field
        document.getElementById("user-message").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        // Function to format current time
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Function to handle sending a message and receiving a response
        function sendMessage() {
            const userMessage = document.getElementById('user-message').value.trim();
            if (!userMessage) return;

            const chatBox = document.getElementById('chat-box');
            const currentTime = getCurrentTime();

            // Display user's message with new styling
            chatBox.innerHTML += `
                <div class="user-message-wrapper">
                    <div class="message user-message">
                        <div class="message-content">${userMessage}</div>
                        <div class="message-meta">${currentTime}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('user-message').value = '';  // Clear input

            // Scroll to the bottom of the chat
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show typing indicator
            const typingIndicator = document.getElementById('typing-indicator');
            typingIndicator.classList.add('active');

            // Send message to server
            fetch("", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `user_message=${encodeURIComponent(userMessage)}`
            })
            .then(response => response.json())
            .then(data => {
                // Hide typing indicator after a small delay for better UX
                setTimeout(() => {
                    typingIndicator.classList.remove('active');
                    
                    // Display bot's response with new styling
                    if (data.bot_response) {
                        chatBox.innerHTML += `
                            <div class="bot-message-wrapper">
                                <div class="message bot-message">
                                    <div class="message-content">${data.bot_response}</div>
                                    <div class="message-meta">${getCurrentTime()}</div>
                                </div>
                            </div>
                        `;
                        chatBox.scrollTop = chatBox.scrollHeight;  // Scroll to bottom
                    } else if (data.error) {
                        // Show error as a message rather than an alert for better UX
                        chatBox.innerHTML += `
                            <div class="bot-message-wrapper">
                                <div class="message bot-message" style="border: 1px solid #f87171;">
                                    <div class="message-content">Sorry, an error occurred. Please try again.</div>
                                    <div class="message-meta">${getCurrentTime()}</div>
                                </div>
                            </div>
                        `;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }, 600);
            })
            .catch(error => {
                console.error('Error:', error);
                setTimeout(() => {
                    typingIndicator.classList.remove('active');
                    // Show connection error message
                    chatBox.innerHTML += `
                        <div class="bot-message-wrapper">
                            <div class="message bot-message" style="border: 1px solid #f87171;">
                                <div class="message-content">Sorry, I couldn't connect. Please try again.</div>
                                <div class="message-meta">${getCurrentTime()}</div>
                            </div>
                        </div>
                    `;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 600);
            });
        }
    </script>
</body>
</html>
