services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-chatbot-app
    ports:
      - "8000:8000"
    volumes:
      # Mount media directory to persist uploaded files and RAG indices
      - ./media:/app/media
      # Mount database to persist data
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - DJANGO_SETTINGS_MODULE=ChatBotMain.settings
      - DEBUG=True
      # Add your API keys here or use .env file
      - GROQ_API_KEY=${GROQ_API_KEY:-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}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-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}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyC28fVBwe3qhRnluIT4x2mLhElSqexQUC8}
      - TF_ENABLE_ONEDNN_OPTS=0
    restart: unless-stopped
    stdin_open: true
    tty: true

